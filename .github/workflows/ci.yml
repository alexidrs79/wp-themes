name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # There is no build step and no automated deploy, so a parse error in a
      # template part would otherwise only show up as a broken page on live.
      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './*/node_modules/*')
          exit $status
